[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ferrox-cli"
version = "1.2.3"
authors = [
    { name = "Shukhrat", email = "shukhrat@example.com" },
]
description = "A Devin-style AI CLI with local file access, fallback engines, and permission controls."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "rich>=12.0.0",
    "colorama>=0.4.6",
    "click>=8.0.0",
    "prompt_toolkit>=3.0.0",
    "pygments>=2.16.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.13",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "httpx>=0.24.0",
    "tiktoken>=0.7.0",
    "ddgs>=9.0.0",
    "textual>=0.50.0",
    "asciimatics>=1.14.0",
    "blessed>=1.20.0",
    # NEW: Immediate Value
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "python-dotenv>=1.0.0",
    "toml>=0.10.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    # NEW: AI Enhancements
    "praw>=7.7.0",
    "playwright>=1.40.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    # NEW: Production Ready
    "sentry-sdk>=1.32.0",
    "prometheus-client>=0.19.0",
    "bandit>=1.7.5",
    # NEW: Real-Time Visualization & Multi-Agent Support
    "aiofiles>=23.0.0",
    "asyncio-throttle>=1.0.0",
    "psutil>=5.9.0",
    "sortedcontainers>=2.4.0",
    # NEW: Advanced Memory System
    "chromadb>=0.4.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    # NEW: MCP Client (Browser, Fetch, and any MCP server)
    "mcp>=1.27.0",
    # NEW: X Bot Social Automation
    "twikit>=2.0.0",
    "feedparser>=6.0.0",
    "pytz>=2024.1",
    "networkx>=3.2",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
database = [
    "psycopg2-binary>=2.9.0",
    "mysql-connector-python>=8.0.0",
]
social = [
    "twikit>=2.0.0",
    "feedparser>=6.0.0",
    "pytz>=2024.1",
    "playwright-stealth>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",
    "types-toml>=0.10.0",
]

[project.scripts]
ferrox = "ferrox.cli:main"

[tool.mypy]
ignore_missing_imports = true
exclude = ["mcp"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ferrox*"]
